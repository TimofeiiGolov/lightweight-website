<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f08" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="FPV POLYGON — браузерный симулятор учебно-боевого FPV-дрона. Миссии, тренировки, свободный полёт." />
  <title>FPV ПОЛИГОН — симулятор FPV-дрона</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230d120a'/%3E%3Ccircle cx='16' cy='9' r='4' fill='none' stroke='%23ffc94d' stroke-width='2'/%3E%3Ccircle cx='16' cy='23' r='4' fill='none' stroke='%23ffc94d' stroke-width='2'/%3E%3Ccircle cx='9' cy='16' r='4' fill='none' stroke='%23ffc94d' stroke-width='2'/%3E%3Ccircle cx='23' cy='16' r='4' fill='none' stroke='%23ffc94d' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23ffc94d'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 3D-канвас рендерится сюда -->
  <div id="app"></div>

  <!-- OSD-канвас (поверх 3D, под UI) -->
  <canvas id="osd"></canvas>

  <!-- Боевой HUD: стики + кнопки -->
  <div id="hud" class="hidden">
    <div id="stick-zone-left" class="stick-zone"></div>
    <div id="stick-zone-right" class="stick-zone"></div>
    <div id="objective-banner"></div>
    <div id="hud-buttons">
      <button id="btn-pause" class="hud-btn small" aria-label="Пауза">II</button>
      <button id="btn-arm" class="hud-btn arm" aria-label="Arm / Disarm">ARM</button>
      <button id="btn-drop" class="hud-btn" aria-label="Сброс груза">DROP</button>
      <button id="btn-tilt-up" class="hud-btn tiny" aria-label="Наклон камеры +">T+</button>
      <button id="btn-tilt-dn" class="hud-btn tiny" aria-label="Наклон камеры −">T−</button>
      <button id="btn-reset" class="hud-btn small" aria-label="Ресет дрона">RST</button>
    </div>
  </div>

  <!-- Меню (главное, пауза, результаты, настройки, помощь) -->
  <div id="menu-root"></div>

  <!-- Подсказка про ориентацию -->
  <div id="rotate-hint" class="hidden">
    <div class="rotate-inner">
      <div class="rotate-icon">⟳</div>
      <div>Поверни телефон горизонтально<br/>для управления стиками</div>
      <button id="rotate-dismiss" class="menu-btn">Всё равно играть</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
